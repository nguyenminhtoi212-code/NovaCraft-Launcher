# Mesin Rust (Horizon) untuk NovaCraft.
# Variabel lingkungan HORIZON_ENGINE_* menang atas isi berkas ini. Kosongkan commit= untuk build tanpa mesin Rust.
source_repo=https://github.com/starling-client/starling
commit=68a2c4dd1b9a9e511ad3758a79ab772b6f9e5b29

# release = optimasi penuh (ThinLTO). fast = tanpa LTO.
profile=release

# Versi NDK Android yang dipakai proyek sumber.
ndk=28.2.13676358

# Set patch Horizon untuk NovaCraft (kosongkan untuk mesin tanpa perubahan).
patch_set=amber3

# Repo tempat Release mesin dicari saat build luar CI (kosong = gunakan mesin bawaan/lokal tanpa GitHub repo lama).
release_repo=
